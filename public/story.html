<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story — theonlyrosh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      height: 600vh;
      font-family: 'Space Grotesk', sans-serif;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Pinned fullscreen video ── */
    #scrollVideo {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    /* ── Dark vignette on edges ── */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 50% 50%,
        transparent 30%,
        rgba(0,0,0,0.5) 60%,
        rgba(0,0,0,0.9) 100%
      );
    }

    /* ── 2px yellow progress bar ── */
    #progress-bar {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0%;
      background: #FFE500;
      box-shadow: 0 0 8px #FFE500;
      z-index: 20;
    }

    /* ── Chapter labels ── */
    .chapter {
      position: fixed;
      bottom: 11%;
      left: 5%;
      z-index: 5;
      opacity: 0;
      will-change: opacity;
      padding-left: 12px;
      border-left: 3px solid #FFE500;
    }
    .chapter-num {
      display: block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      line-height: 1.4;
    }
    .chapter-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      margin-top: 3px;
    }

    /* ── Scroll hint ── */
    #scroll-hint {
      position: fixed;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: opacity 0.6s ease;
    }
    #scroll-hint svg { animation: chevron-bounce 1.3s ease-in-out infinite; }
    #scroll-hint span {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      animation: hint-pulse 2s ease-in-out infinite;
    }

    /* ── Watermark ── */
    #watermark {
      position: fixed;
      bottom: 20px;
      right: 24px;
      z-index: 5;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.4);
    }

    /* ── Loading screen ── */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.9s ease;
    }
    #loader-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #FFE500;
      animation: neon-pulse 1.1s ease-in-out infinite;
    }

    /* ── Keyframes ── */
    @keyframes neon-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 8px #FFE500, 0 0 20px #FFE500;
        opacity: 1;
      }
      50% {
        transform: scale(1.7);
        box-shadow: 0 0 20px #FFE500, 0 0 55px #FFE500;
        opacity: 0.3;
      }
    }
    @keyframes chevron-bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(7px); }
    }
    @keyframes hint-pulse {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 0.9; }
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <div id="loader-dot"></div>
  </div>

  <!-- Pinned background video — muted, no controls, scroll drives currentTime -->
  <video id="scrollVideo" muted playsinline preload="auto">
    <source src="/videos/web fin.mp4" type="video/mp4">
  </video>

  <!-- Edge vignette -->
  <div id="vignette"></div>

  <!-- Progress bar -->
  <div id="progress-bar"></div>

  <!-- Chapter labels (one per sixth of scroll) -->
  <div class="chapter" id="chapter-0">
    <span class="chapter-num">01 / 06</span>
    <span class="chapter-label">The Signal</span>
  </div>
  <div class="chapter" id="chapter-1">
    <span class="chapter-num">02 / 06</span>
    <span class="chapter-label">Neural Storm</span>
  </div>
  <div class="chapter" id="chapter-2">
    <span class="chapter-num">03 / 06</span>
    <span class="chapter-label">Hardwire</span>
  </div>
  <div class="chapter" id="chapter-3">
    <span class="chapter-num">04 / 06</span>
    <span class="chapter-label">Chromatic Protocol</span>
  </div>
  <div class="chapter" id="chapter-4">
    <span class="chapter-num">05 / 06</span>
    <span class="chapter-label">Deep Compile</span>
  </div>
  <div class="chapter" id="chapter-5">
    <span class="chapter-num">06 / 06</span>
    <span class="chapter-label">Broadcast</span>
  </div>

  <!-- Scroll hint -->
  <div id="scroll-hint">
    <svg width="22" height="13" viewBox="0 0 22 13" fill="none">
      <path d="M1.5 1.5L11 11L20.5 1.5" stroke="#FFE500" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>SCROLL</span>
  </div>

  <!-- Watermark -->
  <div id="watermark">theonlyrosh</div>

  <script>
    const video       = document.getElementById('scrollVideo');
    const loader      = document.getElementById('loader');
    const progressBar = document.getElementById('progress-bar');
    const chapters    = Array.from(document.querySelectorAll('.chapter'));
    const scrollHint  = document.getElementById('scroll-hint');

    let ticking    = false;
    let hasScrolled = false;

    // ── Wait for metadata before attaching scroll listener ──
    video.addEventListener('loadedmetadata', () => {

      // Dismiss loader
      loader.style.opacity = '0';
      setTimeout(() => { loader.style.display = 'none'; }, 950);

      const scrollHeight = document.body.scrollHeight - window.innerHeight;

      window.addEventListener('scroll', () => {

        // Hide hint on first scroll
        if (!hasScrolled) {
          hasScrolled = true;
          scrollHint.style.opacity = '0';
          scrollHint.style.pointerEvents = 'none';
        }

        // Debounce to one update per animation frame — avoids layout thrashing
        if (ticking) return;
        ticking = true;

        requestAnimationFrame(() => {
          const fraction = Math.min(window.scrollY / scrollHeight, 1);

          // ── Core mechanic: scroll position → video currentTime (direct, no lerp) ──
          video.currentTime = fraction * video.duration;

          // ── Progress bar ──
          progressBar.style.width = (fraction * 100) + '%';

          // ── Chapter labels ──
          const idx      = Math.min(Math.floor(fraction * 6), 5);
          const within   = (fraction * 6) - idx; // 0→1 within this chapter

          chapters.forEach((el, i) => {
            if (i !== idx) {
              el.style.opacity = '0';
              return;
            }
            // Fade in over first 15%, full from 15–75%, fade out over last 25%
            let opacity = 1;
            if (within < 0.15)      opacity = within / 0.15;
            else if (within > 0.75) opacity = (1 - within) / 0.25;
            el.style.opacity = Math.max(0, Math.min(1, opacity));
          });

          ticking = false;
        });

      }, { passive: true });
    });
  </script>

</body>
</html>
